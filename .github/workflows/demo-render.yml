name: Demo video render

# Renders the launch demo's silent picture (Remotion, compositions DemoV8 and
# VerticalV8) from demo/video. Music and sound effects are mixed outside the
# repo; nothing here carries audio. Lives only on demo/** branches.
on:
  push:
    branches: ["demo/**"]
    paths: ["demo/video/**", ".github/workflows/demo-render.yml"]

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: demo/video
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx remotion browser ensure
      - name: Render
        run: |
          mkdir -p out
          npx remotion render DemoV8 out/demo-v8-silent.mp4 --codec=h264 --crf=18 --muted
          npx remotion render VerticalV8 out/vertical-v8-silent.mp4 --codec=h264 --crf=18 --muted
      - uses: actions/upload-artifact@v4
        with:
          name: demo-v8-silent
          path: demo/video/out/*.mp4
          retention-days: 1
