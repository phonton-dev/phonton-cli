name: Local model smoke

# Runs benchmarks/smoke against a released Linux binary and a local model in
# Ollama on a CPU-only runner. No provider key, no network inference.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Released CLI version to test, or "source" to build this commit
        default: "source"
      model:
        description: Ollama model
        default: "qwen2.5-coder:3b"
      runs:
        description: Runs per task
        default: "3"
  push:
    branches: ["bench/**"]

permissions:
  contents: read

jobs:
  build:
    if: (inputs.version || 'source') == 'source'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked --release -p phonton-cli
      - uses: actions/upload-artifact@v4
        with:
          name: phonton-bin
          path: target/release/phonton

  smoke:
    name: ${{ matrix.fixture }}
    needs: build
    if: always() && (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include:
          - fixture: ledger
            tasks: ledger-thousands,ledger-parens,ledger-balance-on,ledger-csv-quote
          - fixture: shop
            tasks: shop-coupon-expiry,shop-cancel-restock,shop-top-ties,shop-review-duplicate
    env:
      VERSION: ${{ inputs.version || 'source' }}
      MODEL: ${{ inputs.model || 'qwen2.5-coder:7b' }}
      RUNS: ${{ inputs.runs || '1' }}
      OLLAMA_VERSION: "0.34.2"
      GH_TOKEN: ${{ github.token }}
    steps:
      - run: echo "PHONTON_HOME=$RUNNER_TEMP/phonton-home" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - if: env.VERSION == 'source'
        uses: actions/download-artifact@v4
        with:
          name: phonton-bin
          path: ${{ runner.temp }}/cli

      - name: Install the CLI
        run: |
          if [ "$VERSION" != source ]; then
            gh release download "v$VERSION" --repo "$GITHUB_REPOSITORY" \
              --pattern 'phonton-x86_64-unknown-linux-gnu.tar.gz' --dir "$RUNNER_TEMP/cli"
            tar -xzf "$RUNNER_TEMP/cli/phonton-x86_64-unknown-linux-gnu.tar.gz" -C "$RUNNER_TEMP/cli"
          fi
          BIN=$(find "$RUNNER_TEMP/cli" -type f -name phonton | head -1)
          chmod +x "$BIN"
          echo "BIN=$BIN" >> "$GITHUB_ENV"
          "$BIN" version

      - name: Start Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          if ! curl -sf http://127.0.0.1:11434/api/version; then
            (ollama serve > "$RUNNER_TEMP/ollama.log" 2>&1 &)
            for i in $(seq 1 30); do curl -sf http://127.0.0.1:11434/api/version && break; sleep 1; done
          fi
          ollama pull "$MODEL"

      - name: Set up the local model
        run: |
          mkdir -p "$PHONTON_HOME"
          printf '[provider]\nname = "ollama"\nmodel = "%s"\n' "$MODEL" > "$PHONTON_HOME/config.toml"
          free -h
          "$BIN" models setup "$MODEL" | tee "$RUNNER_TEMP/setup.json"

      - name: Run the smoke tasks
        run: |
          node benchmarks/smoke/run.mjs --arm local --runtime unverified \
            --runs "$RUNS" --tasks "${{ matrix.tasks }}" --bin "$BIN" \
            --out "$RUNNER_TEMP/results/${{ matrix.fixture }}"
          cat "$RUNNER_TEMP/results/${{ matrix.fixture }}/summary.md" >> "$GITHUB_STEP_SUMMARY"

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: local-smoke-${{ matrix.fixture }}
          path: |
            ${{ runner.temp }}/results
            ${{ runner.temp }}/setup.json
            ${{ runner.temp }}/ollama.log
          if-no-files-found: warn
