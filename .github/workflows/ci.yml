name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Rust workspace
    # The Linux release image (see release-binaries.yml). Playwright has no
    # Chromium for ubuntu-latest, which is Ubuntu 26.04 since October 2026.
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Node test dependencies
        run: |
          npm ci --ignore-scripts
          npx playwright install chromium

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked --workspace --no-fail-fast

      - name: Build CLI
        run: cargo build --locked --release -p phonton-cli

  macos:
    name: macOS (local runtime and CLI)
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy --locked -p phonton-local -p phonton-cli --all-targets -- -D warnings

      - name: Test local runtime
        run: cargo test --locked -p phonton-local --no-fail-fast

  windows:
    name: Windows (workspace)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Node test dependencies
        run: |
          npm ci --ignore-scripts
          npx playwright install chromium

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      # Includes the symlinked rustup-proxy case (cargo.exe -> rustup.exe, as
      # scoop installs it); with CI set, that test fails instead of skipping.
      - name: Test
        run: cargo test --locked --workspace --no-fail-fast
